<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <img src="wotd_icon.webp" alt="Word checker icon" class="site-icon" />
    <h1>Word of the Day Checker</h1>

    <p>Type a word to see whether it has already been used.</p>

    <input id="wordInput" type="text" placeholder="Enter a word" />
    <button id="checkButton">Check</button>

    <p id="result"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
